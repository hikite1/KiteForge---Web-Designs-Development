# Netlify build configuration
#
# The site is plain static files at the repo root. The build command runs the
# Playwright test suite first: if it fails, the deploy is aborted and the last
# good version stays live. Then scripts/build.sh copies only the deployable
# files into `dist/` so node_modules / tests / config never ship.
# Note: no `--with-deps` on playwright install - Netlify's build container blocks
# the sudo it needs. The base image already has the libs headless Chromium uses.

[build]
  command = "npm ci && npx playwright install chromium && npm test && bash ./scripts/build.sh"
  publish = "dist"


[build.environment]
  NODE_VERSION = "20"

# Security + caching headers (also mirrored in ./_headers for local tooling)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.facebook.com https://web.facebook.com; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- Redirects from the old WordPress site --------------------------------
# The old kiteforge.org WP install was a bare default: only the homepage plus
# WordPress's stock hello-world / sample-page / uncategorized URLs (crawled
# 2026-09-10, Rank Math sitemap). Homepage path is unchanged; the rest 301 home.

[[redirects]]
  from = "/hello-world"
  to = "/"
  status = 301

[[redirects]]
  from = "/sample-page"
  to = "/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/feed"
  to = "/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301
